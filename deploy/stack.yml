services:
  web:
    image: ${SNS_WEB_IMAGE:?SNS_WEB_IMAGE must be an immutable digest reference}
    networks:
      - app_net
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --output-document=/dev/null http://127.0.0.1:3000/ || exit 1
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    stop_grace_period: 20s
    deploy:
      replicas: ${SNS_WEB_REPLICAS:-1}
      placement:
        constraints:
          - node.hostname == swarm-worker-02
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 60s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 60s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        reservations:
          cpus: "0.05"
          memory: 32M
        limits:
          cpus: "0.50"
          memory: 256M

networks:
  app_net:
    external: true
    name: starsnap-main_app-net
